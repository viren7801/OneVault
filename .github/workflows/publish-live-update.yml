name: Publish OneVault Live Update
concurrency:
  group: onevault-main-publisher
  cancel-in-progress: false


on:
  push:
    branches:
      - main
    paths-ignore:
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - android/**
      - ios/**
      - public/live-updates/**
      - public/.well-known/**
      - .github/workflows/publish-live-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[live-update-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: "https://gskxfpuotdynbeokruhj.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_CrOQDv7o5DNUBiw0PKZhPg_aq8H9eTD"
      VITE_BUILD_ID: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Package live update
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/live-updates
          mkdir -p public/live-updates
          (
            cd dist
            zip -qr "../public/live-updates/latest.zip" .
          )
          CHECKSUM="$(sha256sum public/live-updates/latest.zip | awk '{print $1}')"
          cat > public/live-updates/latest.json <<EOF
          {
            "bundleId": "${GITHUB_SHA}",
            "url": "https://raw.githubusercontent.com/viren7801/OneVault/main/public/live-updates/latest.zip",
            "checksum": "${CHECKSUM}"
          }
          EOF
          echo "Published live bundle ${GITHUB_SHA} (${CHECKSUM})"
          rm -rf /tmp/onevault-live-update
          mkdir -p /tmp/onevault-live-update
          cp -a public/live-updates/. /tmp/onevault-live-update/

      - name: Commit live update metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/live-updates

          if git diff --cached --quiet; then
            echo "No live update changes."
            exit 0
          fi

          git commit -m "chore: publish live update [live-update-generated]"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another workflow. Resetting to latest main and restoring this live bundle (attempt ${attempt}/5)…"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            rm -rf public/live-updates
            mkdir -p public/live-updates
            cp -a /tmp/onevault-live-update/. public/live-updates/
            git add public/live-updates

            if git diff --cached --quiet; then
              echo "Live update metadata disappeared after reset; restoring failed."
              exit 1
            fi

            git commit -m "chore: publish live update [live-update-generated]"

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "Could not publish live update metadata after 5 attempts."
          exit 1
