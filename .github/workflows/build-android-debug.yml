name: Build Android Debug APK
# Final native base build: Update Center is included in the web layer.

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - android/**
      - src/lib/nativePasskeys.js
      - .github/workflows/build-android-debug.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    env:
      VITE_SUPABASE_URL: "https://gskxfpuotdynbeokruhj.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_CrOQDv7o5DNUBiw0PKZhPg_aq8H9eTD"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Read debug signing certificate
        id: signing
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${APKSIGNER}" && test -x "${APKSIGNER}"
          CERT_OUTPUT="$("${APKSIGNER}" verify --print-certs app/build/outputs/apk/debug/app-debug.apk 2>&1)"
          printf '%s\n' "${CERT_OUTPUT}"
          SHA256="$(printf '%s\n' "${CERT_OUTPUT}" | awk -F': ' '/certificate SHA-256 digest:/ {print $3; exit}' | tr -d '\r')"
          test -n "${SHA256}"
          SHA256_COLON="$(printf '%s' "${SHA256}" | sed 's/../&:/g; s/:$//')"
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"
          echo "sha256_colon=${SHA256_COLON}" >> "${GITHUB_OUTPUT}"
          APK_KEY_HASH="$(printf '%s' "${SHA256}" | tr -d ':' | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=')"
          echo "apk_key_hash=android:apk-key-hash:${APK_KEY_HASH}" >> "${GITHUB_OUTPUT}"
          echo "Android SHA-256 certificate: ${SHA256}"
          echo "Supabase native RP origin: android:apk-key-hash:${APK_KEY_HASH}"

      - name: Publish Digital Asset Links
        env:
          ANDROID_SHA256: ${{ steps.signing.outputs.sha256_colon }}
        run: |
          set -euo pipefail
          mkdir -p public/.well-known
          cat > public/.well-known/assetlinks.json <<EOF
          [
            {
              "relation": [
                "delegate_permission/common.get_login_creds",
                "delegate_permission/common.handle_all_urls"
              ],
              "target": {
                "namespace": "android_app",
                "package_name": "com.patelviren.onevault",
                "sha256_cert_fingerprints": [
                  "${ANDROID_SHA256}"
                ]
              }
            }
          ]
          EOF
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p public/.well-known
            cat > public/.well-known/assetlinks.json <<EOF
          [
            {
              "relation": [
                "delegate_permission/common.get_login_creds",
                "delegate_permission/common.handle_all_urls"
              ],
              "target": {
                "namespace": "android_app",
                "package_name": "com.patelviren.onevault",
                "sha256_cert_fingerprints": [
                  "${ANDROID_SHA256}"
                ]
              }
            }
          ]
          EOF
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/.well-known/assetlinks.json
            git commit -m "chore: publish Android asset links" || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Could not publish Android Asset Links after 3 attempts."
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onevault-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK artifact metadata
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cat > public/latest-android-build.json <<EOF
          {
            "runId": "${RUN_ID}",
            "artifactId": "${ARTIFACT_ID}",
            "artifactName": "onevault-android-debug",
            "commit": "${GITHUB_SHA}"
          }
          EOF
          git add public/latest-android-build.json
          git commit -m "chore: publish latest Android artifact metadata" || true
          git push origin HEAD:main
